[project]
name = "local-ai-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tanvir-2026", email = "tanvir.mazumder01@talentpro.global" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]



[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
module-name = "app"
[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
